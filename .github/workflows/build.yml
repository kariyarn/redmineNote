# 깃허브에서 exe · 설치 파일 만들기: Actions → build → Run workflow (브랜치 고르기) → 끝나면 아래 Artifacts 에서 받기
# - 정식 릴리스: main 에서 Run workflow 로 돌리면 Releases 에 v<버전> 으로 올리고 Latest 로 표시한다
#   → README 맨 위 '최신 버전 내려받기' 링크와 앱 안 업데이트(releases/latest)가 늘 이 파일을 가리킨다
# - 베타 릴리스: PR 이 main 에 머지되면 자동으로 v<버전>-beta.<번호> 를 Pre-release 로 쌓는다 (Latest 가 아니라서 위 링크 · 앱 업데이트에는 안 잡힌다)
#   머지 결과가 PR 마지막 커밋과 같은 내용이면 다시 빌드하지 않고 그 커밋의 'PR 확인' 빌드 결과물을 그대로 올린다 (다르면 다시 빌드)
# - PR 을 열거나 고칠 때: 빌드가 되는지만 확인한다 (받는 방법은 같음, Artifacts)
# 채널: PR 확인 · 베타 릴리스는 '베타' 로, Run workflow 는 '정식' 으로 빌드한다 (rnotes/channel.py 를 바꿔 쓴다).
#   베타는 exe(RedmineNotes2-Beta.exe) · 설치 위치 · 포트 · 창 · 작업 표시줄이 정식과 따로이고, 노트 데이터는 같이 쓴다
name: build
# 실행 목록에서 무엇을 하는 실행인지 보이게
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && format('베타 릴리스: {0}', github.event.pull_request.title)
  || github.event_name == 'pull_request' && format('PR 확인: {0}', github.event.pull_request.title)
  || github.ref == 'refs/heads/main' && '정식 릴리스 (main)'
  || format('빌드: {0}', github.ref_name) }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]   # closed: 머지됐을 때만 베타 릴리스 (그냥 닫힌 PR 은 아래 if 로 건너뛴다)

permissions:
  contents: write   # Releases 에 올리기 (main 에서 직접 돌릴 때 · PR 이 main 에 머지됐을 때만 쓴다)
  actions: read     # 머지 때 'PR 확인' 빌드의 결과물(Artifacts)을 받아 다시 쓰려고

jobs:
  build:
    # 머지 없이 닫힌 PR 은 빌드하지 않는다
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: windows-latest
    # 베타 번호가 겹치지 않게 릴리스를 만드는 실행은 한 번에 하나씩 (PR 확인 빌드는 PR 마다 따로)
    concurrency:
      group: ${{ (github.event.action == 'closed' || github.event_name == 'workflow_dispatch') && 'release' || format('pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # 머지된 PR: 머지 결과(main 에 들어간 커밋)를 빌드한다. 그 밖에는 기본값(이벤트의 커밋)
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}

      - name: 버전 읽기 (rnotes/config.py 의 APP_VERSION)
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path rnotes/config.py -Pattern 'APP_VERSION = "([^"]+)"'
          if (-not $m) { throw "APP_VERSION 을 찾지 못했어요" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          # PR(확인 · 머지) 은 베타, 그 밖(Run workflow)은 정식
          if ("${{ github.event_name }}" -eq "pull_request") {
            "channel=beta", "exe=RedmineNotes2-Beta", "setup=RedmineNotes2-Beta-Setup-$v.exe", "art=RedmineNotes2-Beta-$v" | Add-Content $env:GITHUB_OUTPUT
          } else {
            "channel=stable", "exe=RedmineNotes2", "setup=RedmineNotes2-Setup-$v.exe", "art=RedmineNotes2-$v" | Add-Content $env:GITHUB_OUTPUT
          }

      - name: (머지됐을 때) PR 확인 빌드 결과물 다시 쓰기
        id: reuse
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VER: ${{ steps.ver.outputs.version }}
          ART: ${{ steps.ver.outputs.art }}
          EXE: ${{ steps.ver.outputs.exe }}
          SETUP: ${{ steps.ver.outputs.setup }}
        run: |
          # 머지 결과와 PR 마지막 커밋의 파일 내용(git tree)이 같을 때만 다시 쓴다. 다르면(그사이 main 이 바뀜) 아래에서 다시 빌드
          function Done($why) { "다시 빌드해요: $why"; Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue; "reused=false" >> $env:GITHUB_OUTPUT; exit 0 }
          git fetch --no-tags --depth=1 origin $env:HEAD_SHA 2>&1 | Out-Null
          $mt = git rev-parse "$env:MERGE_SHA^{tree}"; $ht = git rev-parse "$env:HEAD_SHA^{tree}"
          if ($LASTEXITCODE -ne 0 -or -not $ht -or $mt -ne $ht) { Done "머지 결과가 PR 마지막 커밋과 내용이 달라요" }
          $runs = gh run list --workflow build.yml --event pull_request --commit $env:HEAD_SHA --limit 20 --json databaseId,status,conclusion,displayTitle | ConvertFrom-Json
          $runs = @($runs | Where-Object { "$($_.databaseId)" -ne $env:GITHUB_RUN_ID -and $_.displayTitle -notlike '베타 릴리스:*' })   # 지금 이 실행(머지)은 빼고
          if (-not $runs.Count) { Done "이 커밋의 PR 확인 빌드가 없어요" }
          $run = $runs[0]
          if ($run.status -ne 'completed') {
            "PR 확인 빌드($($run.databaseId))가 아직 도는 중이라 끝나길 기다려요"
            gh run watch $run.databaseId --exit-status --interval 15 | Out-Null
            $run = gh run view $run.databaseId --json databaseId,status,conclusion | ConvertFrom-Json
          }
          if ($run.conclusion -ne 'success') { Done "PR 확인 빌드가 성공하지 못했어요 ($($run.conclusion))" }
          gh run download $run.databaseId --name $env:ART --dir dist
          if ($LASTEXITCODE -ne 0) { Done "결과물($env:ART)을 받지 못했어요 (30일이 지나 지워졌을 수 있어요)" }
          if (-not (Test-Path "dist\$env:EXE.exe") -or -not (Test-Path "dist\$env:SETUP")) { Done "받은 결과물에 exe · 설치 파일이 없어요 (예전 정식 빌드일 수 있어요)" }
          "PR 확인 빌드($($run.databaseId))의 결과물을 그대로 써요 — 다시 빌드하지 않아요"
          "reused=true" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v7
        if: steps.reuse.outputs.reused != 'true'
        with:
          python-version: "3.12"

      - name: 채널 정하기 (베타면 rnotes/channel.py 를 바꿔 쓴다)
        if: steps.reuse.outputs.reused != 'true' && steps.ver.outputs.channel == 'beta'
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
        run: |
          @(
            '"""실행 채널 (CI 가 베타 빌드 때 바꿔 썼다)."""',
            'CHANNEL = "beta"',
            "BUILD = `"$env:BUILD_SHA`""
          ) | Set-Content -Encoding utf8 rnotes/channel.py
          Get-Content rnotes/channel.py

      - name: exe 만들기 (build.bat)
        if: steps.reuse.outputs.reused != 'true'
        shell: cmd
        env:
          RN_EXE_NAME: ${{ steps.ver.outputs.exe }}
          # 부트로더를 이 러너에서 직접 컴파일한다: PyInstaller 가 함께 주는 미리 만든 부트로더는 백신(Windows Defender 등)이
          # 악성 코드로 오진하는 일이 잦다 (설치 뒤 실행 시 'CreateProcess 실패; 코드 225' = 바이러스로 차단됨)
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --no-cache-dir --no-binary pyinstaller pyinstaller
          call build.bat

      - name: exe 점검 (임시 데이터 · 임시 포트)
        if: steps.reuse.outputs.reused != 'true'
        run: python tests/test_exe.py dist/${{ steps.ver.outputs.exe }}.exe

      - name: (실패했을 때만) 멈춘 곳 · 오류 내용 보기
        if: failure() && steps.reuse.outputs.reused != 'true'
        shell: pwsh
        env:
          REDMINE_NOTES_NO_APPWIN: "1"
          REDMINE_NOTES_IDLE_SEC: "0"
        run: |
          python -m pip install py-spy
          "== 시험하던 exe 가 아직 떠 있으면: 지금 멈춘 곳 =="
          Get-Process ${{ steps.ver.outputs.exe }} -ErrorAction SilentlyContinue | ForEach-Object { py-spy dump --pid $_.Id; Stop-Process -Id $_.Id -Force }
          "== 콘솔 exe 로 다시 켜서 오류 내용 보기 =="
          python -m PyInstaller --noconfirm --onefile --console --name RedmineNotes2-debug --paths . --add-data "web;web" --add-data "icon.ico;." main.py
          $env:REDMINE_NOTES_HOME = Join-Path $env:RUNNER_TEMP "rn-debug"
          $env:REDMINE_NOTES_PORT = "18962"
          $p = Start-Process dist\RedmineNotes2-debug.exe -ArgumentList nobrowser -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          Start-Sleep 45
          if ($p.HasExited) { "꺼짐 (종료 코드 $($p.ExitCode))" } else {
            "45초 뒤에도 켜져 있음 — 멈춘 곳:"
            Get-Process RedmineNotes2-debug -ErrorAction SilentlyContinue | ForEach-Object { py-spy dump --pid $_.Id }
            Get-Process RedmineNotes2-debug -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          "-- stdout --"; Get-Content out.txt -ErrorAction SilentlyContinue
          "-- stderr --"; Get-Content err.txt -ErrorAction SilentlyContinue

      - name: 설치 파일 만들기 (Inno Setup)
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVer=${{ steps.ver.outputs.version }}" "/DChannel=${{ steps.ver.outputs.channel }}" installer\RedmineNotes2.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일을 만들지 못했어요" }

      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.reused != 'true'
        with:
          name: ${{ steps.ver.outputs.art }}
          path: |
            dist/${{ steps.ver.outputs.setup }}
            dist/${{ steps.ver.outputs.exe }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Releases 에 올리기 (main 에서 Run workflow 로 돌렸을 때만)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          # 파일 이름을 고정해 두면 .../releases/latest/download/<이름> 이 늘 최신 파일을 가리킨다
          New-Item -ItemType Directory -Force rel | Out-Null
          Copy-Item "dist\RedmineNotes2-Setup-$env:VER.exe" rel\RedmineNotes2-Setup.exe
          Copy-Item dist\RedmineNotes2.exe rel\RedmineNotes2.exe
          $tag = "v$env:VER"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "같은 버전($tag)이 이미 있어서 파일만 새로 바꿔 올려요"
            gh release upload $tag rel\RedmineNotes2-Setup.exe rel\RedmineNotes2.exe --clobber
          } else {
            gh release create $tag rel\RedmineNotes2-Setup.exe rel\RedmineNotes2.exe --target $env:GITHUB_SHA --title "레드마인 노트 $env:VER" --notes "설치 파일: RedmineNotes2-Setup.exe (권장) · exe 만: RedmineNotes2.exe. 바뀐 내용은 docs/CHANGELOG.md 참고." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Releases 에 올리지 못했어요" }
          $global:LASTEXITCODE = 0

      - name: 베타 릴리스 올리기 (PR 이 main 에 머지됐을 때만)
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.base.ref == 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # 이 결과물을 빌드한 커밋: 다시 쓴 PR 확인 빌드면 PR 마지막 커밋, 다시 빌드했으면 머지 커밋 (베타 앱의 업데이트 확인이 '같은 빌드인지' 볼 때 쓴다)
          BUILD_SHA: ${{ steps.reuse.outputs.reused == 'true' && github.event.pull_request.head.sha || github.event.pull_request.merge_commit_sha }}
        run: |
          # 같은 버전 안에서 번호를 하나씩 올린다: v2.20.0-beta.1, -beta.2 ... (이미 있으면 다음 번호)
          # 파일 이름에도 버전 · 베타 번호를 넣어 정식 릴리스(RedmineNotes2-Setup.exe · RedmineNotes2.exe, 이름 고정)와 구분한다
          $tags = gh release list --limit 200 --json tagName --jq '.[].tagName'
          $prefix = "v$env:VER-beta."
          $nums = @($tags | Where-Object { $_ -like "$prefix*" } | ForEach-Object { [int]($_.Substring($prefix.Length)) })
          $n = if ($nums.Count) { ($nums | Measure-Object -Maximum).Maximum + 1 } else { 1 }
          $official = [bool]($tags | Where-Object { $_ -eq "v$env:VER" })
          for ($try = 0; $try -lt 5; $try++) {
            $tag = "$prefix$n"
            $setup = "RedmineNotes2-Beta-Setup-$env:VER-beta.$n.exe"; $exe = "RedmineNotes2-Beta-$env:VER-beta.$n.exe"
            Remove-Item rel -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force rel | Out-Null
            Copy-Item "dist\RedmineNotes2-Beta-Setup-$env:VER.exe" "rel\$setup"
            Copy-Item dist\RedmineNotes2-Beta.exe "rel\$exe"
            $notes = @(
              "베타 (미리 보기) 빌드예요. 정식 릴리스는 main 에서 Actions → build → Run workflow 로 만들어요.",
              "",
              "- 머지된 PR: #$env:PR_NUM $env:PR_TITLE ($env:PR_URL)",
              "- 커밋: $env:SHA",
              "- 빌드: $env:BUILD_SHA",
              "- 설치 파일: $setup (권장) · exe 만: $exe",
              "- 베타는 정식과 따로 설치돼요(레드마인 노트 (베타)) — 노트 데이터는 같이 쓰고, 정식과 동시에 켤 수는 없어요.",
              "- 정식 버전의 앱 안 업데이트에는 잡히지 않아요. 베타를 설치하면 그다음부터는 베타의 앱 안 업데이트로 새 베타를 받아요."
            )
            if ($official) { $notes += "- 참고: v$env:VER 정식 릴리스가 이미 있어요 — 이 PR 은 버전(rnotes/config.py 의 APP_VERSION)을 올리지 않았어요." }
            $notes | Set-Content -Encoding utf8 notes.md
            gh release create $tag "rel\$setup" "rel\$exe" --target $env:SHA --title "레드마인 노트 $env:VER beta.$n (PR #$env:PR_NUM)" --notes-file notes.md --prerelease --latest=false
            if ($LASTEXITCODE -eq 0) { "베타 릴리스 $tag 를 올렸어요 ($setup · $exe)"; break }
            "$tag 를 만들지 못해서 다음 번호로 다시 해요"; $n++
          }
          if ($LASTEXITCODE -ne 0) { throw "베타 릴리스를 올리지 못했어요" }
          $global:LASTEXITCODE = 0
